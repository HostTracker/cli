name: CI

# Build, vet and unit-test on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["stable"]
        include:
          # 1.24 is the floor, inherited from the SDK.
          - os: ubuntu-latest
            go: "1.24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Sibling Go SDK (only while go.mod carries a replace directive)
        run: |
          if grep -q '^replace github.com/HostTracker/hosttracker-sdk-go' go.mod; then
            git clone --depth 1 https://github.com/HostTracker/hosttracker-sdk-go ../hosttracker-sdk-go
          fi
        shell: bash
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags live ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go.mod is tidy
        if: runner.os != 'Windows'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
